# like-chatgpt の品質指標を計測し、quality-gate に送るワークフロー。
#
# 計測結果は reports/ にまとめ、submit ジョブが Ingest API に送信する
# （scripts/quality-gate-submit.sh）。合否は quality-gate が .quality-gate.yml で判定する。
#
# 送信先の設定（Settings → Secrets and variables → Actions）:
#   Variables: QG_BASE_URL      取り込み先の quality-gate の URL
#   Secrets:   QG_INGEST_TOKEN  リポジトリ単位の Ingest Token
# どちらかが未設定なら送信だけをスキップする（計測と成果物の保存は行う）。
name: quality-gate

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  measure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0          # merge-base の解決に履歴が必要
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # M-01（JaCoCo）/ M-07（PMD）/ M-08（JUnit XML）/ OpenAPI 仕様の生成
      - name: バックエンドのビルドとテスト
        run: ./backend/mvnw -f backend/pom.xml -B verify

      - name: OpenAPI 仕様の同期検証
        run: |
          git diff --exit-code api/openapi.yml \
            || { echo '::error::api/openapi.yml が最新ではありません。backend で mvn verify を実行して再生成し、コミットしてください'; exit 1; }

      # M-02: 全クラスが対象（送信時に mutationScope=all を付ける）
      - name: ミューテーションテスト（PIT / M-02）
        run: ./backend/mvnw -f backend/pom.xml -B -P mutation test

      - name: バックエンドの成果物の収集
        if: always()
        run: |
          mkdir -p reports/backend reports/contract
          cp backend/target/site/jacoco/jacoco.xml reports/backend/ || true
          cp backend/target/pmd.xml reports/backend/ || true
          cp backend/target/pit-reports/mutations.xml reports/backend/ || true
          # M-08 の契約テストは API を MockMvc で検証するテスト（*ControllerTest）とする。
          # 単体テストまで送ると、M-08 が単体テスト全体の成功率になってしまう
          cp backend/target/surefire-reports/TEST-*ControllerTest.xml reports/contract/ || true

      # M-09: 比較元（PR ならベースブランチとの merge-base、push なら直前のコミット）の
      # api/openapi.yml と比べる。比較元に定義が無ければ新規 API として申告する
      - name: OpenAPI の破壊的変更の検出（oasdiff / M-09）
        run: |
          if [ -n "${{ github.base_ref }}" ]; then
            BASE=$(git merge-base HEAD "origin/${{ github.base_ref }}")
          else
            BASE=$(git rev-parse HEAD~1)
          fi
          if git show "$BASE:api/openapi.yml" > reports/openapi-base.yml 2>/dev/null; then
            docker run --rm -v "$PWD:/w" -w /w tufin/oasdiff \
              breaking reports/openapi-base.yml api/openapi.yml --format json > reports/oasdiff.json
            [ -s reports/oasdiff.json ] || echo '[]' > reports/oasdiff.json
          else
            echo '[]' > reports/oasdiff.json
            touch reports/oasdiff-base-spec-missing
          fi

      - name: フロントエンドの依存関係
        run: cd frontend && npm ci

      - name: フロントエンドのテスト（Vitest / カバレッジ / M-01）
        run: cd frontend && npm run test:coverage

      - name: 脆弱性スキャン（Trivy / M-06）
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          format: sarif
          output: reports/trivy.sarif
          severity: CRITICAL,HIGH,MEDIUM

      # 違反があっても CI は止めない。合否は quality-gate が axe の結果から判定する
      - name: アクセシビリティ検査（Playwright + axe-core / M-10）
        run: cd frontend && npx playwright install --with-deps chromium && npm run test:a11y
        continue-on-error: true

      # テストが落ちても成果物は残す。違反で落ちたときこそ、その違反を判定に届ける必要がある
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: quality-gate-reports
          path: reports/

  submit:
    needs: measure
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: quality-gate-reports
          path: reports/
        continue-on-error: true
      - name: quality-gate へ送信
        env:
          QG_BASE_URL: ${{ vars.QG_BASE_URL }}
          QG_INGEST_TOKEN: ${{ secrets.QG_INGEST_TOKEN }}
          QG_REPOSITORY: ${{ github.repository }}
          # PR ではマージコミットではなく PR の先頭コミットを計測対象として送る
          QG_COMMIT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          QG_BRANCH: ${{ github.head_ref || github.ref_name }}
          QG_PR_NUMBER: ${{ github.event.pull_request.number }}
          QG_RUNNER_TYPE: github-hosted
          QG_TRIGGERED_BY: ${{ github.event_name }}
          QG_CI_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ -z "$QG_BASE_URL" ] || [ -z "$QG_INGEST_TOKEN" ]; then
            echo '::notice::QG_BASE_URL または QG_INGEST_TOKEN が未設定のため、quality-gate への送信をスキップします'
            exit 0
          fi
          if [ ! -s reports/backend/mutations.xml ]; then
            export QG_SKIPPED="M-02"
          fi
          ./scripts/quality-gate-submit.sh
        continue-on-error: true   # quality-gate の障害で CI を止めない
